<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WC Radio Simulator — Ukraine War Radio Study</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #viewDiv { height: 100%; width: 100%; }

    #legend {
      position: absolute; top: 12px; right: 12px; z-index: 999;
      background: rgba(0,0,0,0.85); color: #eee; padding: 14px 18px;
      border-radius: 8px; font: 13px/1.6 sans-serif; min-width: 200px;
    }
    #legend h3 { margin-bottom: 8px; font-size: 14px; color: #fff; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    #legend .row:hover { background: rgba(255,255,255,0.08); }
    #legend .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    #legend .badge { font-size: 11px; color: #999; }

    #controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 999; background: rgba(0,0,0,0.8); padding: 10px 18px;
      border-radius: 8px; font: 13px sans-serif; color: #ddd;
      display: flex; gap: 14px; align-items: center;
    }
    #controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    #controls input[type="checkbox"] { accent-color: #4fc3f7; }

    #status {
      position: absolute; bottom: 80px; left: 12px; z-index: 999;
      background: rgba(0,0,0,0.7); color: #aaa; padding: 6px 12px;
      border-radius: 6px; font: 12px monospace;
    }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <div id="legend">
    <h3>📻 Radio Types — Ukraine War Study</h3>
    <div class="row" data-type="vhf"><span class="swatch" style="background:#00bcd4"></span> VHF Handheld <span class="badge">(5–15 km)</span></div>
    <div class="row" data-type="uhf"><span class="swatch" style="background:#ff9800"></span> UHF Vehicular <span class="badge">(20–50 km)</span></div>
    <div class="row" data-type="hf"><span class="swatch" style="background:#e91e63"></span> HF Long-Range <span class="badge">(80–250 km)</span></div>
    <div class="row" data-type="directional"><span class="swatch" style="background:#4caf50"></span> Directional Relay <span class="badge">(60° cone)</span></div>
  </div>

  <div id="controls">
    <label><input type="checkbox" checked data-layer="vhf" /> VHF</label>
    <label><input type="checkbox" checked data-layer="uhf" /> UHF</label>
    <label><input type="checkbox" checked data-layer="hf" /> HF</label>
    <label><input type="checkbox" checked data-layer="directional" /> Directional</label>
    <label><input type="checkbox" checked data-layer="coverage" /> Coverage</label>
  </div>

  <div id="status">Connecting…</div>

  <script src="https://js.arcgis.com/4.29/init.js"></script>
  <script>
    require([
      'esri/Map', 'esri/views/MapView',
      'esri/layers/GraphicsLayer', 'esri/Graphic',
    ], function (Map, MapView, GraphicsLayer, Graphic) {

      const WS_URL = 'ws://' + location.host + '/ws/radios';
      const WS_COV = 'ws://' + location.host + '/ws/coverage';

      // Symbols by type
      const POINT_SYMS = {
        vhf:        { type: 'simple-marker', color: '#00bcd4', size: 5, outline: null },
        uhf:        { type: 'simple-marker', color: '#ff9800', size: 6, outline: null },
        hf:         { type: 'simple-marker', color: '#e91e63', size: 7, outline: null },
        directional:{ type: 'simple-marker', color: '#4caf50', size: 6, style: 'diamond', outline: null },
      };
      const FILL_SYMS = {
        vhf:        { type: 'simple-fill', color: [0,188,212,0.07], outline: { color: [0,188,212,0.2], width: 0.5 } },
        uhf:        { type: 'simple-fill', color: [255,152,0,0.06], outline: { color: [255,152,0,0.15], width: 0.5 } },
        hf:         { type: 'simple-fill', color: [233,30,99,0.05], outline: { color: [233,30,99,0.12], width: 0.5 } },
        directional:{ type: 'simple-fill', color: [76,175,80,0.08], outline: { color: [76,175,80,0.2], width: 0.5 } },
      };

      // Graphics layers
      var pointLayer = new GraphicsLayer({ id: 'radios' });
      var polyLayer = new GraphicsLayer({ id: 'coverage' });

      var map = new Map({
        basemap: 'dark-gray-vector',
        layers: [polyLayer, pointLayer],
      });

      var view = new MapView({
        container: 'viewDiv',
        map,
        center: [31.5, 48.5],
        zoom: 6,
      });

      var radioMap = {};  // TRACKID → Graphic (for update)
      var covMap = {};

      function connectWS(url, isPolygon) {
        var ws = new WebSocket(url);
        ws.onopen = function () {
          // Send handshake
          ws.send(JSON.stringify({
            format: 'websocket',
            spatialReference: { wkid: 4326 },
          }));
        };
        ws.onmessage = function (e) {
          try {
            var msg = JSON.parse(e.data);
            // Skip handshake echo
            if (msg.error === null) return;

            var geom = msg.geometry;
            var attrs = msg.attributes || {};
            var type = attrs.type || 'vhf';
            var trackId = attrs.TRACKID;

            if (isPolygon) {
              if (!geom || !geom.rings) return;
              var existing = covMap[trackId];
              var sym = FILL_SYMS[type] || FILL_SYMS.vhf;
              if (existing) {
                existing.geometry = { type: 'polygon', rings: geom.rings, spatialReference: { wkid: 4326 } };
                existing.symbol = sym;
              } else {
                var g = new Graphic({
                  geometry: { type: 'polygon', rings: geom.rings, spatialReference: { wkid: 4326 } },
                  symbol: sym,
                  attributes: attrs,
                });
                polyLayer.add(g);
                covMap[trackId] = g;
              }
            } else {
              if (!geom || geom.x == null || geom.y == null) return;
              var existing = radioMap[trackId];
              var sym = POINT_SYMS[type] || POINT_SYMS.vhf;
              if (existing) {
                existing.geometry = { type: 'point', x: geom.x, y: geom.y, spatialReference: { wkid: 4326 } };
                existing.symbol = sym;
                existing.attributes = attrs;
              } else {
                var g = new Graphic({
                  geometry: { type: 'point', x: geom.x, y: geom.y, spatialReference: { wkid: 4326 } },
                  symbol: sym,
                  attributes: attrs,
                });
                pointLayer.add(g);
                radioMap[trackId] = g;
              }
            }
            updateStatus();
          } catch (err) { /* skip */ }
        };
        ws.onerror = function () { console.warn('WS error:', url); };
        ws.onclose = function () {
          setTimeout(function () { connectWS(url, isPolygon); }, 2000);
        };
        return ws;
      }

      function updateStatus() {
        document.getElementById('status').textContent =
          Object.keys(radioMap).length + ' radios · ' +
          Object.keys(covMap).length + ' zones';
      }

      // Visibility
      function updateVisibility() {
        var isOn = function (n) { return document.querySelector('[data-layer="' + n + '"]:checked') !== null; };
        pointLayer.visible = isOn('vhf') || isOn('uhf') || isOn('hf') || isOn('directional');
        polyLayer.visible = isOn('coverage');
      }

      // Click legend → zoom
      document.querySelectorAll('#legend .row').forEach(function (el) {
        el.addEventListener('click', function () {
          var type = el.getAttribute('data-type');
          var gs = pointLayer.graphics.filter(function (g) {
            return g.attributes && g.attributes.type === type;
          });
          if (gs.length) view.goTo({ target: gs, zoom: 8 });
        });
      });

      // Click point → zoom
      view.on('click', function (e) {
        view.hitTest(e.screenPoint).then(function (r) {
          var hit = r.results && r.results.find(function (h) {
            return h.graphic && h.graphic.layer === pointLayer;
          });
          if (hit) {
            var g = hit.graphic;
            var pt = g.geometry;
            view.goTo({ center: [pt.longitude, pt.latitude], zoom: 10 });
          }
        });
      });

      view.when(function () {
        document.getElementById('status').textContent = 'Connecting WS…';
        document.querySelectorAll('#controls input').forEach(function (el) {
          el.addEventListener('change', updateVisibility);
        });
        updateVisibility();
        updateStatus();

        // Connect WebSockets
        connectWS(WS_URL, false);
        connectWS(WS_COV, true);
      });
    });
  </script>
</body>
</html>
