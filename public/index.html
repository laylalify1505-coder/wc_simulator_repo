<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WC Radio Simulator — Ukraine War Radio Study</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #viewDiv { height: 100%; width: 100%; }

    #legend {
      position: absolute; top: 12px; right: 12px; z-index: 999;
      background: rgba(0,0,0,0.85); color: #eee; padding: 14px 18px;
      border-radius: 8px; font: 13px/1.6 sans-serif; min-width: 200px;
      pointer-events: none;
    }
    #legend h3 { margin-bottom: 8px; font-size: 14px; color: #fff; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #legend .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    #legend .badge { font-size: 11px; color: #999; }
    #legend .clickable { cursor: pointer; transition: background 0.15s; border-radius: 4px; padding: 2px 4px; margin: 0 -4px; }
    #legend .clickable:hover { background: rgba(255,255,255,0.08); }

    #controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 999; background: rgba(0,0,0,0.8); padding: 10px 18px;
      border-radius: 8px; font: 13px sans-serif; color: #ddd;
      display: flex; gap: 14px; align-items: center;
    }
    #controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    #controls input[type="checkbox"] { accent-color: #4fc3f7; }

    #status {
      position: absolute; bottom: 80px; left: 12px; z-index: 999;
      background: rgba(0,0,0,0.7); color: #aaa; padding: 6px 12px;
      border-radius: 6px; font: 12px monospace;
    }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <div id="legend">
    <h3>📻 Radio Types &mdash; Ukraine War Study</h3>
    <div class="row clickable" data-type="vhf"><span class="swatch" style="background:#00bcd4"></span> VHF Handheld <span class="badge">(squad, 5–15 km)</span></div>
    <div class="row clickable" data-type="uhf"><span class="swatch" style="background:#ff9800"></span> UHF Vehicular <span class="badge">(convoy, 20–50 km)</span></div>
    <div class="row clickable" data-type="hf"><span class="swatch" style="background:#e91e63"></span> HF Long-Range <span class="badge">(HQ, 80–250 km)</span></div>
    <div class="row clickable" data-type="directional"><span class="swatch" style="background:#4caf50"></span> Directional Relay <span class="badge">(observer, 60&deg; cone)</span></div>
  </div>

  <div id="controls">
    <label><input type="checkbox" checked data-layer="vhf" /> VHF</label>
    <label><input type="checkbox" checked data-layer="uhf" /> UHF</label>
    <label><input type="checkbox" checked data-layer="hf" /> HF</label>
    <label><input type="checkbox" checked data-layer="directional" /> Directional</label>
    <label><input type="checkbox" checked data-layer="coverage" /> Coverage</label>
  </div>

  <div id="status">Connecting…</div>

  <script src="https://js.arcgis.com/4.29/init.js"></script>
  <script>
    require([
      'esri/Map', 'esri/views/MapView',
      'esri/layers/StreamLayer',
    ], function (Map, MapView, StreamLayer) {

      const ORIGIN = location.origin;

      // ── Radio point StreamLayer ─────────────────────────────────────────
      const radioLayer = new StreamLayer({
        url: ORIGIN + '/arcgis/rest/services/radios/StreamServer',
        purgeOptions: { displayCount: 10000 },
        maxAllowableOffset: 0,
        renderer: {
          type: 'unique-value',
          field: 'type',
          defaultSymbol: { type: 'simple-marker', color: '#888', size: 5, outline: null },
          uniqueValueInfos: [
            { value: 'vhf',        symbol: { type: 'simple-marker', color: '#00bcd4', size: 5, outline: null } },
            { value: 'uhf',        symbol: { type: 'simple-marker', color: '#ff9800', size: 6, outline: null } },
            { value: 'hf',         symbol: { type: 'simple-marker', color: '#e91e63', size: 7, outline: null } },
            { value: 'directional',symbol: { type: 'simple-marker', color: '#4caf50', size: 6, style: 'diamond', outline: null } },
          ],
        },
        popupTemplate: {
          title: '{TRACKID} — {type}',
          content: [
            { type: 'fields', fieldInfos: [
              { fieldName: 'unit', label: 'Unit' },
              { fieldName: 'role', label: 'Role' },
              { fieldName: 'signalStrength', label: 'Signal Strength' },
              { fieldName: 'interference', label: 'Interference' },
              { fieldName: 'battery', label: 'Battery' },
            ]},
          ],
        },
      });

      // ── Coverage polygon StreamLayer ────────────────────────────────────
      const coverageLayer = new StreamLayer({
        url: ORIGIN + '/arcgis/rest/services/coverage/StreamServer',
        purgeOptions: { displayCount: 10000 },
        maxAllowableOffset: 0,
        renderer: {
          type: 'unique-value',
          field: 'type',
          defaultSymbol: { type: 'simple-fill', color: [136,136,136,0.06], outline: { color: [136,136,136,0.12], width: 0.5 } },
          uniqueValueInfos: [
            { value: 'vhf',        symbol: { type: 'simple-fill', color: [0,188,212,0.07], outline: { color: [0,188,212,0.2], width: 0.5 } } },
            { value: 'uhf',        symbol: { type: 'simple-fill', color: [255,152,0,0.06], outline: { color: [255,152,0,0.15], width: 0.5 } } },
            { value: 'hf',         symbol: { type: 'simple-fill', color: [233,30,99,0.05], outline: { color: [233,30,99,0.12], width: 0.5 } } },
            { value: 'directional',symbol: { type: 'simple-fill', color: [76,175,80,0.08], outline: { color: [76,175,80,0.2], width: 0.5 } } },
          ],
        },
        popupTemplate: {
          title: '{TRACKID} Coverage',
          content: [
            { type: 'fields', fieldInfos: [
              { fieldName: 'coverageAreaKm2', label: 'Coverage (km²)' },
              { fieldName: 'beamWidth', label: 'Beam Width' },
              { fieldName: 'type', label: 'Radio Type' },
            ]},
          ],
        },
      });

      // ── Map ───────────────────────────────────────────────────────────
      const map = new Map({
        basemap: 'dark-gray-vector',
        layers: [coverageLayer, radioLayer],
      });

      const view = new MapView({
        container: 'viewDiv',
        map,
        center: [31.5, 48.5], // Ukraine center
        zoom: 6,
      });

      // ── Visibility filtering ─────────────────────────────────────────
      function updateVisibility() {
        const isOn = (name) => document.querySelector(`[data-layer="${name}"]:checked`) !== null;

        const types = [];
        if (isOn('vhf'))        types.push("'vhf'");
        if (isOn('uhf'))        types.push("'uhf'");
        if (isOn('hf'))         types.push("'hf'");
        if (isOn('directional')) types.push("'directional'");

        if (types.length > 0 && types.length < 4) {
          const expr = `type IN (${types.join(',')})`;
          radioLayer.definitionExpression = expr;
          coverageLayer.definitionExpression = expr;
        } else {
          radioLayer.definitionExpression = null;
          coverageLayer.definitionExpression = null;
        }
        coverageLayer.visible = isOn('coverage');
      }

      view.when(function () {
        var status = document.getElementById('status');
        status.textContent = 'Map loaded ✓';

        document.querySelectorAll('#controls input').forEach(function (el) {
          el.addEventListener('change', updateVisibility);
        });
        updateVisibility();

        // Click legend row → zoom to that radio type
          document.querySelectorAll('#legend .clickable').forEach(function (el) {
            el.addEventListener('click', function () {
              var type = el.getAttribute('data-type');
              var gs = radioLayer.graphics ? radioLayer.graphics.filter(function (g) {
                return g.attributes && g.attributes.type === type;
              }) : [];
              if (gs.length > 0) {
                view.goTo({ target: gs, zoom: 8 }).catch(function () {});
              }
            });
          });

          // Click a radio point → zoom to it
          view.on('click', function (event) {
          view.hitTest(event.screenPoint).then(function (response) {
            var hit = response.results && response.results.find(function (r) {
              return r.graphic && r.graphic.layer === radioLayer;
            });
            if (hit) {
              var g = hit.graphic;
              var pt = g.geometry;
              var attrs = g.attributes;
              var zoomLevel = attrs && attrs.type === 'hf' ? 8 : 10;
              view.goTo({ center: [pt.longitude, pt.latitude], zoom: zoomLevel });
            }
          });
        });

        // Track graphics count
        setInterval(function () {
          status.textContent = (radioLayer.graphics ? radioLayer.graphics.length : 0) + ' radios · ' +
                               (coverageLayer.graphics ? coverageLayer.graphics.length : 0) + ' zones';
        }, 2000);
      });
    });
  </script>
</body>
</html>
